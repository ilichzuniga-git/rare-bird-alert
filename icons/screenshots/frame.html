<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  body { margin: 0; }
  .f { width: 1080px; height: 1920px; position: relative; overflow: hidden;
       background: linear-gradient(160deg, #0f5c7a, #1f8fa8); font-family: 'Segoe UI', system-ui, sans-serif; color: #fff; }
  h1 { position: absolute; top: 96px; left: 70px; right: 70px; margin: 0; text-align: center;
       font-size: 64px; font-weight: 700; letter-spacing: -1px; line-height: 1.1; }
  p { position: absolute; top: 196px; left: 90px; right: 90px; margin: 0; text-align: center; font-size: 34px; opacity: .88; }
  .phone { position: absolute; left: 50%; top: 330px; transform: translateX(-50%);
           width: 752px; height: 1520px; border-radius: 48px; overflow: hidden; background: #fff;
           border: 12px solid #0b2f3b; box-shadow: 0 30px 80px rgba(0,0,0,.35); }
  .phone img { width: 100%; display: block; margin-top: -72px; } /* crops the status bar */
</style></head><body><div class="f">
  <h1 id="t"></h1><p id="s"></p><div class="phone"><img id="i"></div>
</div><script>
  var q = new URLSearchParams(location.search);
  document.getElementById('t').textContent = q.get('t');
  document.getElementById('s').textContent = q.get('s');
  document.getElementById('i').src = q.get('i');
</script></body></html>
